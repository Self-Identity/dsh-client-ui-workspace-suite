# Rows this bundle contributes to the profile composition.
#
# 1. The picker backend swap.
#    The shipped `directory-picker` row is the adaptive chooser
#    (`dsh-host-directory-picker-auto`): on a Windows workstation it resolves to
#    the NATIVE backend, whose only capability is the OS chooser (`pick`) — it
#    has no listing (`list`) and no `createDirectory`, so an in-app explorer
#    cannot read a directory level at all. This bundle therefore switches the
#    chooser off: `- id: directory-picker / disabled: true` below.
#
#    The browse backend and its surface are NOT inserted as rows here. They are
#    mounted by this bundle's own host half (`lib/index.js`) as real Loader
#    entries, once the chooser's dynamically mounted native backend has
#    unregistered. Two backends register the same `ctx.directoryPicker` service
#    (and two surfaces occupy the same `single` directory-flow holes), so a
#    statically inserted pair would race the chooser's asynchronous disposal
#    during a live enable in a running client and fail activation with
#    `service "directoryPicker" has been registered at <NativeDirectoryPicker>`.
#    Mounting after the seam is free keeps both a cold boot and a live enable
#    green; `mountPinnedPicker` in lib/index.js carries the details.
#
# 2. This bundle's own row: host half from `lib/index.js` (usage projection +
#    the pinned browse picker pair), browser half attached through the
#    package.json `dsh.client` declaration.
- id: directory-picker
  disabled: true

- insert:
    - id: workspace-suite
      name: dsh-client-ui-workspace-suite
      config: {}
